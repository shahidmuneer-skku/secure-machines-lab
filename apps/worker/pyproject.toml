[project]
name = "sml-worker"
version = "0.1.0"
description = "Secure Machines Lab model worker runtime (Django-free Celery consumers + model adapters)"
requires-python = ">=3.10"
dependencies = [
  "celery>=5.5",
  "redis>=5.2",
  "boto3>=1.35",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "pillow>=11.0",
  "av>=14.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sml_worker*"]

[tool.setuptools.package-data]
sml_worker = ["agents/assets/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Verbatim copies of the owner's EXIEF analyzer, kept identical to the source for easy updates.
extend-exclude = ["sml_worker/exief/signals.py", "sml_worker/exief/pipeline.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "S", "SIM", "RUF"]
# RUF001-3: typographic dashes/quotes in user-facing EN/KO/DE text are intentional.
# S603/S607: model scripts are run from trusted config as argv lists (never through a shell).
ignore = ["S101", "S603", "S607", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
