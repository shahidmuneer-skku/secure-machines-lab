[project]
name = "sml-api"
version = "0.1.0"
description = "Secure Machines Lab platform API (Django)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16",
  "drf-spectacular>=0.28",
  "django-filter>=25.1",
  "django-allauth[mfa]>=65.19",
  "django-environ>=0.12",
  "django-storages[s3]>=1.14",
  "argon2-cffi>=23.1",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "celery>=5.5",
  "boto3>=1.35",
  "pillow>=11.0",
  "filetype>=1.2",
  "av>=14.0",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "stripe>=11.0",
  "reportlab>=4.2",
  "cryptography>=44.0",
  "uvicorn[standard]>=0.34",
  "gunicorn>=23.0",
  "whitenoise>=6.8",
  "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=6.0",
  "factory-boy>=3.3",
  "time-machine>=2.16",
  "respx>=0.22",
  "ruff>=0.9",
  "mypy>=1.14",
  "django-stubs[compatible-mypy]>=5.1",
  "djangorestframework-stubs>=3.15",
  "hypothesis>=6.120",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sml.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs PostgreSQL/Redis (docker compose up)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "SIM", "RUF"]
ignore = ["S101", "RUF012", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"**/migrations/**" = ["E501", "RUF"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "sml.settings.dev"
