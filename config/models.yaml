        conda_env: SKKU-G
        cwd: "{models_root}"
        argv: ["bash", "detection_models/SKKU-G/inference.sh", "{input}", "{stem}", "video", "{page_type}"]
        parser: standard
        timeout_seconds: 3600

  - id: skku-snet
    legacy_ids: [SKKU-SNET, SpecXNet]
    display_name: {en: SKKU-SNET, ko: SKKU-SNET, de: SKKU-SNET}
    description:
      en: Spectral (frequency-domain) detector for AI-generated images.
      ko: 주파수 영역 기반 AI 생성 이미지 탐지 모델.
      de: Spektraler (Frequenzbereich) Detektor für KI-generierte Bilder.
    family: ai_generated
    face_required: false
    xai: gradcam
    default_selected: true
    resident:
      gpu: 3
      servers:
        - script: "{models_root}/detection_models/SpecXNet/predict_with_image.py"
          mode: run   # works at module level: re-run per file, checkpoint kept in memory
          torch_load_cache: true
          warmup:
            - ["--image", "{warmup_image}", "--arch", "ffc_xception", "--ratio", "0.5", "--lfu", "--use_se",
               "--gradcam", "--gradcam_out_dir", "{warmup_dir}", "--inference_dir", "{warmup_dir}", "--output", "/dev/null",
               "--page_type", "ai-image",
               "--resume", "{models_root}/detection_models/SpecXNet/checkpoint_big/ffc_xception/fixFULL-ckpt.best.pth.tar",
               "--artifact_stem", "{stem}"]
    media:
      image:
        conda_env: gid
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/SpecXNet/predict_with_image.py", "--image", "{input}",
               "--arch", "ffc_xception", "--ratio", "0.5", "--lfu", "--use_se", "--gradcam",
               "--gradcam_out_dir", "./inference_images", "--inference_dir", "./inference_images",
               "--output", "/dev/null", "--page_type", "{page_type}",
               "--resume", "detection_models/SpecXNet/checkpoint_big/ffc_xception/fixFULL-ckpt.best.pth.tar",
               "--artifact_stem", "{stem}"]
        parser: standard

  - id: skku-phys
    legacy_ids: [SKKU-PHYS]
    display_name: {en: SKKU-PHYS, ko: SKKU-PHYS, de: SKKU-PHYS}
    description:
      en: Physics-aware detector (lighting, depth and camera consistency) for AI-generated images.
      ko: 조명·깊이·카메라 일관성을 분석하는 물리 기반 AI 생성 이미지 탐지 모델.
      de: Physikbasierter Detektor (Licht, Tiefe, Kamerakonsistenz) für KI-generierte Bilder.
    family: ai_generated
    face_required: false
    xai: none
    default_selected: false
    media:
      image:
        conda_env: phydf_restored
        cwd: "{models_root}"
        argv: ["bash", "detection_models/physDF/inference_api.sh", "{input}", "{stem}", "physics-image"]
        parser: standard
        timeout_seconds: 600

  - id: center
    legacy_ids: [center, Center-I, Center-V]
    display_name: {en: Center, ko: Center, de: Center}
    description:
      en: DINOv3-based detector (Center-I for images, Center-V for videos).
      ko: DINOv3 기반 탐지 모델(이미지 Center-I, 영상 Center-V).
      de: DINOv3-basierter Detektor (Center-I für Bilder, Center-V für Videos).
    family: ai_generated
    face_required: false
    xai: gradcam
    default_selected: true
    show_heatmap: true   # users see this detector's heatmap (owner's default, 2026-10-01)
    trial: true
    resident:
      gpu: 0
      servers:   # run_center_image.py / run_center_video.py launch these
        - id: center-image
          media: [image]
          script: "{models_root}/detection_models/Center/Centaur_dinov3small/inference.py"
          mode: run
          cache: ["load_model_dinowbilat_rope_bilat:load_model"]
          warmup:
            - ["--data_path", "{warmup_image}", "--weights_path", "{models_root}/detection_models/Center/center_ckpt/checkpoint_itr6000.pt",
               "--config_path", "{models_root}/detection_models/Center/Centaur_dinov3small/configs/args.json",
               "--result_file_path", "{warmup_dir}/center-image.csv"]
        - id: center-video
          media: [video]
          script: "{models_root}/detection_models/Center/Centaur_avif/inference.py"
          mode: run
          cache: ["load_model_dinowbilat_rope_bilat:load_model"]
          warmup:
            - ["--data_path", "{warmup_image_dir}", "--weights_path", "{models_root}/detection_models/Center/center_ckpt/checkpoint_itr24000.pt",
               "--config_path", "{models_root}/detection_models/Center/Centaur_avif/configs/args.json",
               "--result_file_path", "{warmup_dir}/center-video.csv"]
    media:
      image:
        conda_env: center
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/Center/run_center_image.py", "--image_path", "{input}",
               "--config_path", "{models_root}/detection_models/Center/Centaur_dinov3small/configs/args.json",
               "--base_dir", "{models_root}", "--artifact_base", "{stem}"]
        parser: center
      video:
        conda_env: center
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/Center/run_center_video.py", "--video_path", "{input}",
               "--file_name", "{stem}", "--original_name", "{original_name_b64}", "--output_path", "./detected",
               "--base_dir", "{models_root}",
               "--config_path", "{models_root}/detection_models/Center/Centaur_avif/configs/args.json"]
        parser: standard
        timeout_seconds: 1800

  - id: inzi
    legacy_ids: [Inzi]
    display_name: {en: Inzi, ko: Inzi, de: Inzi}
    description: {en: Legacy research model (disabled)., ko: 레거시 연구 모델(비활성)., de: Legacy-Forschungsmodell (deaktiviert).}
    family: ai_generated
    enabled: false
    face_required: false
    xai: none
    media:
      image:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/Inzi/predict_with_image.py", "--data", "{input}",
               "--arch", "ffc_resnet152", "--lfu"]
        parser: standard

# Long-form video scanner (interval timeline). Runs the long-video-processor engine.
long_video_models:
  - id: skku-aigc-long
    display_name: {en: "SKKU-AIGC · Long-form", ko: "SKKU-AIGC · 장편 영상", de: "SKKU-AIGC · Langvideo"}
    description:
      en: Temporal transformer that scores every interval of a long video.
      ko: 긴 영상의 모든 구간을 점수화하는 시간적 트랜스포머 모델.
      de: Temporaler Transformer, der jedes Intervall eines langen Videos bewertet.
    default_selected: true
    conda_env: safe
    cwd: "{long_video_root}"
    argv: ["{python}", "-u", "inference_long_video.py", "--video", "{input}", "--interval", "{interval}"]
    parser: long_video_events
    timeout_seconds: 14400

# Audit chain (checks besides the detectors). The admin chooses which run on every job (Admin → Models);
# `builtin` steps (metadata / C2PA) always run.
audit_steps:
  - id: face
    display_name: {en: Face detection, ko: 얼굴 탐지, de: Gesichtserkennung}
    description: {en: Finds faces and crops them for face-based models., ko: 얼굴을 찾아 얼굴 기반 모델용으로 잘라냅니다., de: Findet Gesichter und schneidet sie für gesichtsbasierte Modelle zu.}
    conda_env: mixture3
    cwd: "{models_root}"
    argv: ["{python}", "detect_faces_only.py", "{input}"]
    parser: json_stdout
    timeout_seconds: 300
  - id: safety
    display_name: {en: Content safety (NSFW), ko: 유해성 검사(NSFW), de: Inhaltssicherheit (NSFW)}
    description: {en: Flags adult or harmful content., ko: 성인·유해 콘텐츠를 표시합니다., de: Markiert nicht jugendfreie oder schädliche Inhalte.}
    conda_env: nsfw-image-detection-384
    cwd: "{models_root}/nsfw_detection/nsfw-image-detection-384"
    argv: ["{python}", "detect_nsfw.py", "--json", "{input}"]
    video_argv: ["{python}", "detect_nsfw.py", "--json", "--video-max-frames", "48", "{input}"]
    parser: json_stdout_last_line
    timeout_seconds: 600
  - id: fas
    display_name: {en: Face anti-spoofing, ko: 얼굴 위변조 방지(FAS), de: Anti-Spoofing}
    description: {en: Checks whether a face is a photo/screen replay rather than a live capture., ko: 얼굴이 실제 촬영인지 사진·화면 재촬영인지 확인합니다., de: Prüft, ob ein Gesicht ein Foto/Bildschirm statt einer Live-Aufnahme ist.}
    conda_env: mixture3
    cwd: "{models_root}"
    argv: ["{python}", "run_fas_analysis.py", "{input}", "--margin", "0", "--image_size", "224", "--cuda", "0"]
    parser: json_stdout_last_line
    timeout_seconds: 600
  - id: metadata
    display_name: {en: Metadata & C2PA provenance, ko: 메타데이터 및 C2PA 출처, de: Metadaten & C2PA-Herkunft}
    description: {en: "Reads EXIF/XMP/C2PA and flags AI-generation indicators. Always runs.", ko: "EXIF/XMP/C2PA를 읽고 AI 생성 흔적을 표시합니다. 항상 실행됩니다.", de: "Liest EXIF/XMP/C2PA und markiert Hinweise auf KI-Generierung. Läuft immer."}
    builtin: true
