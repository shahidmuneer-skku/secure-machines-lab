# Detection model registry (data-driven; see docs/adding-a-model.md).
#
# Each entry is a *selectable model*. Models with separate deepfake / AI-generated
# weights are listed as separate variants (owner decision 2026-09-30).
#
# Invocation templates are argv lists (never shell strings). Placeholders:
#   {python}            <CONDA_ROOT>/envs/<conda_env>/bin/python
#   {models_root}       MODELS_ROOT (legacy layout: detection_models/, deepfake_detection-main/, ...)
#   {input}             absolute path of the staged input file (named <stem>.<ext>)
#   {input_dir}         directory that contains only the staged input
#   {stem}              artifact stem (the task id) — outputs are collected by this stem
#   {workdir}           per-task scratch directory (deleted afterwards)
#   {media}             image | video
#   {page_type}         legacy page type derived from media + variant family
#   {original_name_b64} base64 of the user's original file name
#
# Parsers: standard | b2 | safe_csv | center  (all also read FACES_JSON: and the
# inference_csv "Total result" row). Artifacts are collected from
# {models_root}/{inference_images,detected,inference_csv}/<stem>*.

defaults:
  timeout_seconds: 300
  weight: 1.0
  gpu_mem_mb: 6000

# Extra environment variables per conda environment, applied to every model and audit step
# that uses it (on top of the activation the worker always does: PATH, CONDA_PREFIX).
# {env_prefix} is <CONDA_ROOT>/envs/<name>; search-path variables are prepended.
conda_envs:
  # These environments were copied from another machine: dlib's RUNPATH still points at the old
  # /home/dev25 prefix, so its OpenBLAS / cuBLAS / cuSOLVER (shipped in the env's lib/) are not found.
  mixture3:
    LD_LIBRARY_PATH: "{env_prefix}/lib"
  BEYBI:
    # PyTorch (cu121) loads its own cuBLAS 12.1 first; the env's lib/ ships CUDA 12.9 cuSOLVER/cuBLAS
    # for dlib, which then fails (undefined cublasSetEnvironmentMode). Put PyTorch's matching CUDA
    # libraries first and keep lib/ for OpenBLAS and the rest.
    LD_LIBRARY_PATH: "{env_prefix}/lib/python3.8/site-packages/nvidia/cusolver/lib:{env_prefix}/lib/python3.8/site-packages/nvidia/cublas/lib:{env_prefix}/lib/python3.8/site-packages/nvidia/cudnn/lib:{env_prefix}/lib/python3.8/site-packages/nvidia/curand/lib:{env_prefix}/lib"

# What runs: users never choose. `default_selected: true` means "runs on every job of each media type
# the model supports" until an admin changes it per media type on Admin → Models (ADR 0011).
# `show_heatmap: true` means users see that detector's heatmap (one image); the admin can switch it.
# `authentic_boost: 2.0` multiplies a detector's weight when it says authentic (score below the
# threshold); with `authentic_counts_in_all: true` that answer also counts in the other analysis.

# `resident` keeps a detector loaded on a GPU between tasks (owner, 2026-10-01): `python -m sml_worker
# --resident` runs one server per listed script (sml_worker/resident/server.py) in the model's env on
# `gpu`; a task launches the model as usual and the launch is handed to the server. `mode: main` imports
# the script once and calls main(); `mode: run` re-runs it. `cache` names the loaders whose result is kept
# (`name` in the script, or `module:name`); `torch_load_cache` keeps checkpoints read with torch.load;
# `warmup` runs at start so the first task is fast. Without a ready server the model loads per task.

# Aggregation shown to users as one verdict (weighted mean of fake probability).
aggregation:
  method: weighted_mean

models:
  - id: xception
    legacy_ids: [VideoDet1, Xception]
    display_name: {en: Xception, ko: Xception, de: Xception}
    description:
      en: Classic face-manipulation detector (FaceForensics++). Fast.
      ko: 얼굴 조작 탐지 모델(FaceForensics++ 학습). 빠름.
      de: Klassischer Detektor für Gesichtsmanipulation (FaceForensics++). Schnell.
    family: deepfake
    face_required: true
    xai: gradcam
    default_selected: true
    trial: true
    media:
      # Image support disabled 2026-09-30 (owner decision): the weights file
      # deepfake_detection-main/pretrained_model/xception/training_all_manipulation.pt was not copied
      # to this server. Restore the file and uncomment this block to re-enable.
      # image:
      #   conda_env: mixture3
      #   cwd: "{models_root}"
      #   argv: ["{python}", "deepfake_detection-main/image_detecotors/test_for_ifake.py",
      #          "--img_path", "{input}",
      #          "--weight_path", "deepfake_detection-main/pretrained_model/xception/training_all_manipulation.pt",
      #          "--artifact_stem", "{stem}"]
      #   parser: standard
      video:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/Altfreezing/demo.py", "--method_name", "VideoDet1",
               "--file_name", "{stem}", "--video_path", "{input}", "--output_path", "./detected"]
        parser: standard
        timeout_seconds: 1800

  - id: qad
    legacy_ids: [QAD]
    display_name: {en: QAD, ko: QAD, de: QAD}
    description:
      en: Quality-agnostic deepfake detector, robust to compression.
      ko: 압축에 강한 품질 무관 딥페이크 탐지 모델.
      de: Qualitätsunabhängiger Deepfake-Detektor, robust gegenüber Kompression.
    family: deepfake
    face_required: true
    xai: gradcam
    default_selected: true
    trial: true
    media:
      image:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/QAD/test_for_ifake.py", "--img_path", "{input}",
               "--weight_path",
               "detection_models/QAD/pretrained_model/train_img224_shuflfe_warmup3_patient12_raw_c23_c40_one_cycle_batch64_best.pth",
               "--artifact_stem", "{stem}"]
        parser: standard
      video:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/QAD/predict_from_video.py", "--file_name", "{stem}",
               "--video_path", "{input}", "--model_path",
               "./detection_models/QAD/pretrained_model/train_img224_shuflfe_warmup3_patient12_raw_c23_c40_one_cycle_batch64_best.pth",
               "--output_path", "./detected", "--cuda"]
        parser: standard
        timeout_seconds: 1800

  - id: skku
    legacy_ids: [SKKU, BEYBI]
    display_name: {en: SKKU, ko: SKKU, de: SKKU}
    description:
      en: CLIP + LoRA detector for face swaps and AI-generated faces.
      ko: 얼굴 교체 및 AI 생성 얼굴 탐지를 위한 CLIP + LoRA 모델.
      de: CLIP + LoRA-Detektor für Face-Swaps und KI-generierte Gesichter.
    family: deepfake
    face_required: true
    xai: attention
    default_selected: true
    trial: true
    media:
      image:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/BEYBI/image_detection.py", "--current_dir", "./detection_models/BEYBI",
               "--image_path", "{input}", "--model_path", "checkpoint/3_best_model.pt", "--artifact_stem", "{stem}"]
        parser: standard
      video:
        conda_env: BEYBI
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/BEYBI/video_detection.py", "--current_dir", "./detection_models/BEYBI",
               "--file_name", "{stem}", "--video_path", "{input}", "--output_path", "./detected"]
        parser: standard
        timeout_seconds: 1800

  - id: effort-deepfake
    legacy_ids: [Effort]
    display_name: {en: "Effort · Deepfake", ko: "Effort · 딥페이크", de: "Effort · Deepfake"}
    description:
      en: Effort detector with face-forgery weights (FaceForensics++).
      ko: 얼굴 위조 가중치(FaceForensics++)를 사용하는 Effort 모델.
      de: Effort-Detektor mit Gewichten für Gesichtsfälschungen (FaceForensics++).
    family: deepfake
    face_required: true
    xai: attention
    default_selected: true
    media:
      image:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/for_ifakedetector/DF_inference/image_inference.py",
               "--detector_config", "./detection_models/for_ifakedetector/DF_inference/config/detector/effort.yaml",
               "--weights", "./detection_models/for_ifakedetector/DF_inference/ckpt/effort_FF.pth",
               "--image", "{input}",
               "--landmark_model", "./detection_models/for_ifakedetector/DF_inference/dlib_tools/shape_predictor_81_face_landmarks.dat",
               "--artifact_stem", "{stem}"]
        parser: standard
      video:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/for_ifakedetector/DF_inference/video_inference.py",
               "--detector_config", "./detection_models/for_ifakedetector/DF_inference/config/detector/effort.yaml",
               "--weights", "./detection_models/for_ifakedetector/DF_inference/ckpt/effort_FF.pth",
               "--video", "{input}", "--artifact_stem", "{stem}"]
        parser: standard
        timeout_seconds: 1800

  - id: effort-aigen
    legacy_ids: []
    variant_of: effort-deepfake
    display_name: {en: "Effort · AI-Gen", ko: "Effort · AI 생성", de: "Effort · KI-generiert"}
    description:
      en: Effort detector with AI-generated-image weights (Chameleon).
      ko: AI 생성 이미지 가중치(Chameleon)를 사용하는 Effort 모델.
      de: Effort-Detektor mit Gewichten für KI-generierte Bilder (Chameleon).
    family: ai_generated
    face_required: false
    xai: attention
    default_selected: true
    media:
      image:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/for_ifakedetector/DF_inference/image_inference.py",
               "--detector_config", "./detection_models/for_ifakedetector/DF_inference/config/detector/effort.yaml",
               "--weights", "./detection_models/for_ifakedetector/DF_inference/ckpt/effort_chameleon.pth",
               "--image", "{input}",
               "--landmark_model", "./detection_models/for_ifakedetector/DF_inference/dlib_tools/shape_predictor_81_face_landmarks.dat",
               "--artifact_stem", "{stem}"]
        parser: standard
      video:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/for_ifakedetector/DF_inference/video_inference.py",
               "--detector_config", "./detection_models/for_ifakedetector/DF_inference/config/detector/effort.yaml",
               "--weights", "./detection_models/for_ifakedetector/DF_inference/ckpt/effort_chameleon.pth",
               "--video", "{input}", "--artifact_stem", "{stem}"]
        parser: standard
        timeout_seconds: 1800

  - id: skku-r
    legacy_ids: [ReViT, SKKU-R]
    display_name: {en: SKKU-R, ko: SKKU-R, de: SKKU-R}
    description:
      en: ReViT transformer detector for manipulated faces.
      ko: 조작된 얼굴 탐지를 위한 ReViT 트랜스포머 모델.
      de: ReViT-Transformer-Detektor für manipulierte Gesichter.
    family: deepfake
    face_required: true
    xai: attention
    default_selected: true
    media:
      image:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/for_ifakedetector/DF_inference/image_inference.py",
               "--detector_config", "./detection_models/for_ifakedetector/DF_inference/config/detector/revit.yaml",
               "--weights", "./detection_models/for_ifakedetector/DF_inference/ckpt/revit_3M.pth",
               "--image", "{input}",
               "--landmark_model", "./detection_models/for_ifakedetector/DF_inference/dlib_tools/shape_predictor_81_face_landmarks.dat",
               "--artifact_stem", "{stem}"]
        parser: standard
      video:
        conda_env: mixture3
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/for_ifakedetector/DF_inference/video_inference.py",
               "--detector_config", "./detection_models/for_ifakedetector/DF_inference/config/detector/revit.yaml",
               "--weights", "./detection_models/for_ifakedetector/DF_inference/ckpt/revit_3M.pth",
               "--video", "{input}", "--artifact_stem", "{stem}"]
        parser: standard
        timeout_seconds: 1800

  - id: b2
    legacy_ids: [B2, BEYBI2]
    display_name: {en: B2, ko: B2, de: B2}
    description:
      en: CLIP-based generalist detector for diverse generators.
      ko: 다양한 생성 모델에 대응하는 CLIP 기반 범용 탐지 모델.
      de: CLIP-basierter Generalist für verschiedene Generatoren.
    family: deepfake
    face_required: true
    xai: attention
    default_selected: false
    media:
      image:
        conda_env: GID
        cwd: "{models_root}/detection_models/BEYBI2_updated"
        stage_input_dir: true
        convert_webp_to_jpg: true
        argv: ["{python}", "inference.py", "--dataset_root", "{input_dir}", "--weight_path", "model_best.pt",
               "--default_setting", "train_clip.yaml",
               "--landmark_model_path", "{models_root}/detection_models/BEYBI2_updated/dlib_tools/shape_predictor_81_face_landmarks.dat",
               "--artifact_base", "{stem}"]
        parser: b2
      video:
        conda_env: GID
        cwd: "{models_root}"
        stage_input_dir: true
        argv: ["{python}", "detection_models/BEYBI2_updated/inference.py", "--dataset_root", "{input_dir}",
               "--video_path", "{input}", "--output_path", "./detected", "--file_name", "{stem}"]
        parser: b2
        timeout_seconds: 1800

  - id: xb-dfd
    legacy_ids: [XB-DFD]
    display_name: {en: XB-DFD, ko: XB-DFD, de: XB-DFD}
    description:
      en: Explanation-bottleneck face-swap detector (CLIP + BLIP captions) with a heatmap of forgery cues. Heavy.
      ko: 위조 단서 히트맵을 제공하는 설명 병목 기반 얼굴 교체 탐지 모델(CLIP + BLIP 캡션). 무거움.
      de: Face-Swap-Detektor mit Erklärungs-Bottleneck (CLIP + BLIP-Beschreibungen) und Heatmap der Fälschungsspuren. Rechenintensiv.
    family: deepfake
    face_required: true
    xai: gradcam
    default_selected: true
    gpu_mem_mb: 12000   # measured peak 11.2 GB (fp32 weights, 2.9B parameters)
    resident:   # kept loaded (owner, 2026-10-01); see `resident` in the header
      gpu: 3
      servers:
        - script: "{models_root}/detection_models/XB-DFD/sml_infer.py"
          mode: main
          cache: [load_model, FaceCropper]
          warmup:
            - ["--input", "{warmup_image}", "--stem", "{stem}", "--media", "image", "--out-root", "{warmup_dir}"]
    # sml_infer.py is our wrapper around the repo's inference.py. Weights come from the Hugging Face
    # cache (XB-DF/XB-DF). Videos score up to 128 frames spread over the clip and write the standard
    # per-frame CSV.
    media:
      image: &xbdfd_image
        conda_env: wacv
        cwd: "{models_root}/detection_models/XB-DFD"
        argv: ["{python}", "sml_infer.py", "--input", "{input}", "--stem", "{stem}", "--media", "{media}",
               "--out-root", "{models_root}"]
        parser: standard
        timeout_seconds: 900
      video:
        <<: *xbdfd_image
        timeout_seconds: 1800

  - id: skku-aigc
    legacy_ids: [SKKU-AIGC, Safe]
    display_name: {en: SKKU-AIGC, ko: SKKU-AIGC, de: SKKU-AIGC}
    description:
      en: Detects fully AI-generated images and videos (no face needed).
      ko: 완전히 AI로 생성된 이미지·영상을 탐지합니다(얼굴 불필요).
      de: Erkennt vollständig KI-generierte Bilder und Videos (kein Gesicht nötig).
    family: ai_generated
    face_required: false
    xai: none
    default_selected: true
    trial: true
    resident:
      gpu: 1   # the safe env (torch 2.8, CUDA 12.8) runs on the RTX PRO 6000
      servers:
        - id: skku-aigc-image
          media: [image]
          script: "{models_root}/detection_models/Safe/inference.py"
          mode: main
          cache: [DINOv2Binary]
          torch_load_cache: true
          warmup:
            - ["--image", "{warmup_image}", "--model_path", "{models_root}/detection_models/Safe/SafeChallenge/no_temp_2000_iter.pt",
               "--result_file_path", "{warmup_dir}/skku-aigc.csv", "--artifact_base", "{stem}"]
        - id: skku-aigc-video   # run_safe_video.py launches inference_video.py; loads on its first video
          media: [video]
          script: "{models_root}/detection_models/Safe/inference_video.py"
          mode: main
          cache: [DINOv2WithClassifier]
          torch_load_cache: true
    media:
      image:
        conda_env: safe
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/Safe/inference.py", "--image", "{input}",
               "--model_path", "{models_root}/detection_models/Safe/SafeChallenge/no_temp_2000_iter.pt",
               "--result_file_path", "{workdir}/safe_result.csv", "--artifact_base", "{stem}"]
        parser: safe_csv
        result_file: "{workdir}/safe_result.csv"
      video:
        conda_env: safe
        cwd: "{models_root}"
        argv: ["{python}", "detection_models/Safe/run_safe_video.py", "--video_path", "{input}",
               "--file_name", "{stem}", "--original_name", "{original_name_b64}",
               "--output_path", "./detected", "--base_dir", "{models_root}"]
        parser: standard
        timeout_seconds: 1800

  - id: skku-p
    legacy_ids: [SKKU-P]
    display_name: {en: SKKU-P, ko: SKKU-P, de: SKKU-P}
    description:
      en: Mask2Former + DINOv3 detector with per-face scores. Heavy; most accurate on faces.
      ko: 얼굴별 점수를 제공하는 Mask2Former + DINOv3 모델. 무겁지만 얼굴에서 가장 정확합니다.
      de: Mask2Former + DINOv3 mit Scores pro Gesicht. Rechenintensiv, am genauesten bei Gesichtern.
    family: deepfake
    face_required: true
    xai: gradcam
    default_selected: false
    gpu_mem_mb: 30000
    fallbacks:
      on_no_face: center   # inference.sh reports SKKU_P_NO_FACE_DETECTED and runs Center itself
    media:
      image: &skkup_image
        conda_env: wacv
        cwd: "{models_root}"
        argv: ["bash", "detection_models/SKKU-P/inference.sh", "{input}", "{stem}", "image", "{page_type}"]
        parser: standard
        timeout_seconds: 900
      video:
        <<: *skkup_image
        argv: ["bash", "detection_models/SKKU-P/inference.sh", "{input}", "{stem}", "video", "{page_type}"]
        timeout_seconds: 3600

  - id: skku-p2
    legacy_ids: [SKKU-P2]
    display_name: {en: SKKU-P2, ko: SKKU-P2, de: SKKU-P2}
    description:
      en: SKKU-P successor on a DINOv3 ViT-7B backbone. Very heavy.
      ko: DINOv3 ViT-7B 백본 기반 SKKU-P 후속 모델. 매우 무거움.
      de: SKKU-P-Nachfolger mit DINOv3-ViT-7B-Backbone. Sehr rechenintensiv.
    family: deepfake
    face_required: true
    xai: gradcam
    default_selected: false
    gpu_mem_mb: 40000
    # Owner (2026-10-01): SKKU-P2 recognises authentic images best, so when it says authentic it
    # counts twice, in the face-swap and the AI-generation analysis. Editable in Admin → Models.
    authentic_boost: 2.0
    authentic_counts_in_all: true
    resident:
      gpu: 0
      servers:
        - script: "{models_root}/detection_models/SKKU-P2/demo_mask2former_vit_7b_qkv_lora.py"
          mode: main
          cache: [build_model, load_checkpoint_flexible, _load_face_detector]
          env: {CUBLAS_WORKSPACE_CONFIG: ":4096:8"}   # inference.sh sets it; cuBLAS reads it once
          warmup:
            - ["--input", "{warmup_image}", "--infer_ckpt", "{models_root}/detection_models/SKKU-P2/checkpoints/model_state.pt",
               "--device", "cuda", "--num_video_frames", "0", "--output_dir", "{warmup_dir}/skku-p2",
               "--scores_csv", "{warmup_dir}/skku-p2/scores.csv", "--enable_face_crop"]
    media:
      image:
        conda_env: wacv
        cwd: "{models_root}"
        argv: ["bash", "detection_models/SKKU-P2/inference.sh", "{input}", "{stem}", "image", "{page_type}"]
        parser: standard
        timeout_seconds: 900
      video:
        conda_env: wacv
        cwd: "{models_root}"
        argv: ["bash", "detection_models/SKKU-P2/inference.sh", "{input}", "{stem}", "video", "{page_type}"]
        parser: standard
        timeout_seconds: 3600

