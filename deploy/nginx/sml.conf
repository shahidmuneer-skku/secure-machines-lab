# Secure Machines Lab — nginx reverse proxy (TLS termination).
#
#   app.example.com    → Next.js :3000, with /api/* routed straight to Django :8000
#   media.example.com  → S3 storage :58333 (presigned downloads and multipart upload parts)
#
# Replace the two server_name values and the certificate paths (certbot --nginx works),
# then: sudo ln -s /path/to/repo/deploy/nginx/sml.conf /etc/nginx/sites-enabled/sml.conf
# The .env must match: PUBLIC_WEB_URL=https://app.example.com,
# S3_PUBLIC_ENDPOINT_URL=https://media.example.com, and apps/web STORAGE_ORIGIN the same,
# STREAM_PUBLIC_URL=/stream/ws (apps/web STREAM_ORIGIN empty).

upstream sml_web { server 127.0.0.1:3000; keepalive 16; }
upstream sml_api { server 127.0.0.1:8000; keepalive 16; }
upstream sml_s3  { server 127.0.0.1:58333; keepalive 8; }
upstream sml_stream { server 127.0.0.1:8100; }

# Never trust a client-supplied X-Real-IP; Django reads only this header (sml.core.middleware.client_ip).
map $remote_addr $sml_client_ip { default $remote_addr; }

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com media.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sml_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    server_tokens off;

    # Default request body limit; larger limits below where uploads are expected.
    client_max_body_size 25m;
    client_body_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $sml_client_ip;
    proxy_set_header X-Forwarded-For $sml_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # --- Django API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://sml_api;
        proxy_read_timeout 120s;
    }

    # Browser uploads (images, videos up to 200 MB; larger videos go to media.* directly)
    # and the guest trial.
    location ~ ^/api/v1/(uploads|trial/detect)$ {
        client_max_body_size 250m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://sml_api;
    }

    # One-call API detection accepts whole videos (UPLOAD_MAX_VIDEO_BYTES, 4 GB by default).
    location = /api/v1/detect {
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_pass http://sml_api;
    }

    # Server-Sent Events: live job progress. No buffering, long-lived connections.
    location ~ ^/api/v1/(events/stream|trial/jobs/[0-9a-f-]+/stream)$ {
        proxy_pass http://sml_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Service-to-service endpoints: never reachable from outside.
    location /api/internal/ { return 404; }

    # Long-form streaming (apps/stream): the browser streams the video over a WebSocket.
    location /stream/ws {
        proxy_pass http://sml_stream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;
        proxy_buffering off;
    }
    location /stream/ { return 404; }  # health/model catalog are for the API only

        # --- Next.js -----------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://sml_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://sml_web;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.example.com;

    ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    server_tokens off;

    # Multipart parts are 64 MB (sml.media.storage.PART_SIZE).
    client_max_body_size 128m;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        # Presigned URLs are signed for this exact Host; do not rewrite it.
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_pass http://sml_s3;
    }
}
